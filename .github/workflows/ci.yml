# CI = Continuous Integration.
# On every push or pull request to main/develop, GitHub starts a fresh Ubuntu machine,
# installs Java 21, builds both modules and runs all tests.
# Result appears as a green tick / red cross next to each commit on GitHub.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 21 and cache Maven downloads (~/.m2) so later runs are faster
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build + run every test in both modules (-B = batch mode, cleaner logs)
      - name: Build and test
        run: mvn -B verify

      # 4. Keep the test reports even when tests fail, so you can download and read them
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
